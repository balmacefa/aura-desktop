name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aura version
      description: Output of `aura version`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: For example Windows 11 24H2 (26100)
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display setup
      description: Resolution, scaling, number of monitors
  - type: textarea
    id: doctor
    attributes:
      label: Output of `aura doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Run `aura logs` to find the file (%LOCALAPPDATA%\Aura\logs). Remove anything private.
      render: text
