name: Release
# Se publica una versión subiendo una etiqueta:  git tag v2.0.1 && git push origin v2.0.1
# (la etiqueta debe coincidir con __version__ en src/aura/__init__.py y tener su sección en CHANGELOG.md)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: La etiqueta debe coincidir con la versión del código
        shell: pwsh
        run: |
          $v = (Select-String -Path src/aura/__init__.py -Pattern "__version__ = '(.+)'").Matches.Groups[1].Value
          if ("v$v" -ne "$env:GITHUB_REF_NAME") { throw "La etiqueta $env:GITHUB_REF_NAME no coincide con __version__ = $v" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m pip install pyinstaller
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - name: Notas de la versión (sección del CHANGELOG)
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Aura $env:VERSION" }
          $body += "`n`n---`nInstall: download **Aura-Setup-$env:VERSION.exe**, open it and follow the steps. Windows may show a SmartScreen notice because the installer is not code-signed yet: click *More info* then *Run anyway*. The checksums are in **SHA256SUMS.txt**.`n`nInstalar: descarga **Aura-Setup-$env:VERSION.exe**, ábrelo y sigue los pasos. Windows puede mostrar un aviso de SmartScreen porque el instalador aún no está firmado: pulsa *Más información* y luego *Ejecutar de todas formas*."
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
      - name: Publicar en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/Aura-Setup-$env:VERSION.exe" "dist/Aura-portable-$env:VERSION.zip" dist/SHA256SUMS.txt --title "Aura $env:VERSION" --notes-file release-notes.md
