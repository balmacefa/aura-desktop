name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests tools scripts
      - run: python -m unittest discover -s tests -v

  build:
    # Comprueba que Aura.exe y el instalador se construyen en cada cambio (no se publica nada).
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: aura-windows-build
          path: |
            dist/Aura-Setup-*.exe
            dist/Aura-portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
