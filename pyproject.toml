[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-desktop"
dynamic = ["version"]
description = "Animated, interactive desktop wallpapers and widgets for Windows 10/11."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "balmacefa" }]
keywords = ["wallpaper", "widgets", "windows", "desktop", "interactive", "webgl"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []                                    # solo biblioteca estándar: nada que instalar

[project.optional-dependencies]
dev = ["pyinstaller>=6.10"]                          # para construir Aura.exe (`python scripts/build.py`)

[project.scripts]
aura = "aura.cli:entry"

[project.gui-scripts]
aura-gui = "aura.cli:entry"

[project.urls]
Homepage = "https://balmacefa.github.io/aura-desktop/"
Repository = "https://github.com/balmacefa/aura-desktop"
Issues = "https://github.com/balmacefa/aura-desktop/issues"
Changelog = "https://github.com/balmacefa/aura-desktop/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "aura.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aura = ["assets/**/*"]
